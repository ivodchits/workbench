[package]
name = "duck-android"
version = "0.1.0"
description = "Duck on the phone: the assistant app (assistant plan R4, H5)."
authors = ["Workbench"]
edition = "2021"

[lib]
name = "duck_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A debug build's symbols made a 250 MB APK; the Kotlin side is what gets debugged.
[profile.dev]
debug = false
strip = "symbols"
