[package]
name = "workbench"
version = "2.1.1"
description = "A cockpit for supervising multiple Claude Code agents across projects."
authors = ["Workbench"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
# Phase 2: the local hook bridge (design §4.4). axum on 127.0.0.1 receives the
# `http` hooks Claude Code POSTs; tokio supplies the listener axum serves on (we
# run it on Tauri's own async runtime). Phase 4 (step 4.3) reuses both for the
# remote access server: `axum`'s `ws` feature for the live-status WebSocket, and
# tokio `sync` for the broadcast/oneshot channels that fan snapshots to clients and
# stop the server gracefully.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "macros", "time", "process"] }
# Step 4.3: enumerate local network interfaces to find the Tailscale address
# (100.64.0.0/10) the remote server binds to — we never bind broader than the tailnet.
if-addrs = "0.13"
# Step G8: watch a repo's git dir + working tree so the Git panel refreshes itself
# when an agent commits or edits under it (design §4 — the app supervises processes
# that mutate the repo concurrently, so a panel that only updates when *you* click
# is showing you the past). `default-features = false` drops the crossbeam channel
# and the debouncer's serde support; we do our own coalescing in the watcher module
# and send events over Tauri's event bus, not a channel we'd have to poll.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Step K1: a plugin text field's `pattern`, checked when the file is read and again
# before an action runs (the toolbar checks the same pattern with a JS RegExp).
regex = "1"
# Step R3: the QR code beside the public (Funnel) address in the Remote Access menu,
# rendered as an SVG string. `default-features = false` drops the `image` crate.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# Step R6: Web Push to the phone. A push is an HTTPS POST to the phone's push
# service (FCM, Mozilla, Apple), signed with our VAPID key (ES256) and encrypted per
# RFC 8291 (ECDH P-256 + HKDF-SHA256 + AES-128-GCM). `ureq` is a small blocking
# client with rustls — pushes go out on a short-lived thread, nothing else here
# makes outbound requests.
ureq = { version = "3", default-features = false, features = ["rustls"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
# Step A1: Duck's loopback proxy to the Anthropic API. `reqwest` (already in the
# tree through Tauri) streams the response back as it arrives (`stream`), over the
# OS TLS stack (`native-tls`, Schannel on Windows) so no extra crypto builds;
# `futures-util` maps the byte stream through the usage meter.
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls", "http2"] }
futures-util = "0.3"
# Step B2: Duck's host for stdio MCP servers from your Claude Code config (your
# Firefox bridge). `rmcp` speaks the protocol over the child's pipes; the process
# is started without a window and its tree killed when idle.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
tauri-plugin-autostart = "~2.5.1"
# Step V1: speech to text on the device. `ort` is pinned to rc.12 (rc.14 broke
# transcribe-rs in X0, and our Parakeet runner is adapted from it); `load-dynamic`
# loads onnxruntime.dll from the models folder on first use, so nothing is linked
# into the app and nothing is in memory until voice is used. `ndarray` matches ort's.
# `zip` unpacks the runtime from its wheel.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Step V6: the wake word's model comes as sherpa-onnx's .tar.bz2 (pure-Rust bzip2).
bzip2 = "0.6"
tar = { version = "0.4", default-features = false }
tauri-plugin-global-shortcut = "~2.3"
cpal = "0.16"
xcap = "0.9.8"
# Step G1 adds JPEG, GIF, WebP and BMP for attachments (downscaled, thumbnails).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Step V4: the turn detector's input is a Whisper log-mel spectrogram, whose
# 400-point FFT runs 800 times per check.
rustfft = "6"
# Step V4, part 2: echo cancellation, WebRTC's AEC3 ported to Rust. On X0's speaker
# recording it matched livekit's native build (29.3 dB at 16 kHz, no false
# barge-ins), with nothing to build in C++.
sonora = "0.2"

# Windows-only: intercept WebView2 accelerator keys so we can suppress the engine's
# built-in reload shortcuts (F5 / Ctrl+R / Ctrl+Shift+R), which would otherwise
# reload the whole renderer and drop every live console (see `accel` module). Pinned
# to the versions Tauri 2 already resolves (Cargo.lock) so we share one compiled copy.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Step G1: drag an attachment out of the window to Explorer (OLE).
drag = "2.1.1"
# Step A1 adds the Credential Manager API, where Duck's API key lives.
windows = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Credentials",
    "Win32_Foundation",
    # Step V1: DirectML.dll loaded by path; AC power for the GPU preference.
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    # Step V2: the speech sidecar runs below normal priority.
    "Win32_System_Threading",
    # Step V4: whether the output is headphones or speakers (the endpoint's form
    # factor), which decides whether you can talk over Duck.
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # Step V6: whether another app has the microphone (the privacy store).
    "Win32_System_Registry",
    # Step H2: what's playing, and the media keys (the media sessions).
    "Media_Control",
] }

