[project]
name = "workbench-voice-runtime"
version = "1"
requires-python = "==3.12.*"
dependencies = [
  "kokoro-onnx==0.4.9",
  "torch==2.8.0",
  "numpy<2.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
